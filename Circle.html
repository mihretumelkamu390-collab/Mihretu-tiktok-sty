<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduSmart Ethiopia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
    transition:0.3s;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#087f5b,#12b886);
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#ffe066;
}

.menu{
    display:flex;
    gap:18px;
}

.menu button{
    background:none;
    border:none;
    color:white;
    font-size:15px;
    cursor:pointer;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#12b886,#087f5b);
    color:white;
    padding:60px 20px;
    text-align:center;
}

.hero h1{
    font-size:40px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    max-width:700px;
    margin:auto;
    line-height:1.6;
}

.hero button{
    margin-top:25px;
    padding:13px 25px;
    border:none;
    border-radius:25px;
    background:white;
    color:#087f5b;
    font-weight:bold;
    cursor:pointer;
}

/* SEARCH */

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

/* GENERAL */

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
}

/* SUBJECTS */

.subjects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.subject{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.3s;
}

.subject:hover{
    transform:translateY(-5px);
}

.subject-icon{
    font-size:40px;
    margin-bottom:15px;
}

.subject h3{
    margin-bottom:10px;
}

.subject p{
    color:#666;
    line-height:1.5;
}

/* NOTES */

.notes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.note{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.note h3{
    color:#087f5b;
    margin-bottom:12px;
}

.note p{
    line-height:1.7;
}

.note button{
    margin-top:15px;
    padding:10px 18px;
    background:#087f5b;
    color:white;
    border:none;
    border-radius:8px;
}

/* QUIZ */

.quiz-box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.question{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

    width:100%;
